[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "AI coding agent for GitHub issues"
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]
